<!DOCTYPE html>
<html>

<head>
    <title>My Ice Cream Shop Menu</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: azure;
            text-align: center;
            color: orange;
        }

        h1 {
            color: aquamarine;
            font-weight: bold;
            background-color: black;
            border-radius: 10px;
        }

        h1 {
            font-size: 36px;
            color: lightblue;
        }

        h1+p {
            color: lawngreen;
            font-weight: bold;
            background-color: yellow;
            border-radius: 10px;
        }

        .shop-descriptiom::first-letter {
            font-size: 36px;
            color: magenta;
            font-weight: bolder;
        }

        .menu-box {
            width: 420px;
            background-color: blue;
            border: 3px solid #ff69b4;
            border-radius: 15px;
        }

        ul>li {
            list-style: georgian;
            background-color: whitesmoke;
            color: purple;
            font-size: medium;
            border-radius: 10px;
            border: 2px solid #ffb6c1;
        }

        ul>li:nth-child(3) {
            background-color: cornflowerblue;
            color: burlywood;
            border: 3px solid olivedrab;
        }

        ul>li:hover {
            background-color: red;
            color: white;
            transform: scale(1.05);
        }

        button {
            background-color: #d63384;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            background-color: firebrick;
        }
    </style>
</head>
<h1>My Ice Cream Shop Menu</h1>
<p>Welcome to Scoops of Joy!</p>
<p class="shop-description">
    We serve colourful, creamy, and delicious ice cream flavours.
</p>
<div class="menu-box">
    <h2>Today's Ice Cream Flavours</h2>
    <ul>
        <li>Chocolate Delight</li>
        <li>Strawberry Swirl</li>
        <li>Mango Magic - Today's Special</li>
        <li>Vanilla Dream</li>
        <li>Blueberry Blast</li>
    </ul>
    <button>Order Now</button>
</div>
</body>

</html>
