<!DOCTYPE html>
<html>

<head>

    <link href=https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">



</head>


<body>
    <!--container-fluid: streches to fill the full width of the screen-->
    <div class="container-fluid border border-dark p-2 mb-3 bg-success">
        <h1 class="text-dark text-uppercase"> My hobby hub!
        </h1>
        <p class="text-center"> A page of my favourite games.</p>
    </div>
    <!--container: keeps cotent neat and clean-->
    <div class="container-border border-dark text-white p-3 mb-2 bg-success">
        <h1 class="text-white text-center"> Reading!
        </h1>
        <p class="text-white">I ike to read and discover informations</p>
    </div>
    <!-- bg-warning: yellow background with a dark border -->
    <div class="container-fluid border-radius text-align p-3 mb-2 bg-warning">
        <h1 class="text-center text-decoration">Drawing!
            <p class="text-center">I enjoy making scenery</p>
    </div> 
    <!-- bg-info: teal background with a dark border -->
    <div class="container-border border-dark text-lowercase p-3 mb-3 bg-info">
        <h1 class="text-primary text-uppercase"> coding!
        </h1>
        <p class="text-left"> I am build app with boostrap elements</p>
    </div> 
    <!-- bg-danger: red background, white text -->
    <div class="container-border border-dark text-primary mb-2 bg-danger">
        <h1 class="text-left text-lowercase">sports!
            <p class="text-dark">I play football and works hard</p>

    </div> 
    <!-- container-fluid footer: full-width dark bar at the bottom -->
    <div class="container-fluid border-dark text-align p-3 mb-2 bg-danger">
        <h1 class="text-white ">Made with Bootstrap</h1>
</body>

</html>
