<!DOCTYPE html>
<html>

<body>
    <p>A Function can access variables defined inside the function:</p>
    <button type="button" onclick="myFunction()">Click Me!
    </button>
    <p id="demo"></p>
    <p id="demo1"></p>
    <script>
        var b = 5; // global var 

        function myFunction() {
            var a = 4; // local var 
            document.getElementById("demo").innerHTML = b * a;
        }
        document.getElementById("demo").innerHTML = a;
        document.getElementById("demo1").innerHTML = b;







    </script>





</body>






</html>
