<!DOCTYPE HTML>
<html>

<head>
    <title>My Restraunt Menu Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: peachpuff;
            color: aquamarine;
        }

        .menu-card {
            width: 600px;
            border: 3px solid #138b25;
            border-radius: 15px;
            background-color: blue;
            box-shadow: 0 0 20px grey;
        }

        .dish-description {
            font-size: 15px;
            line-height: 1, 6;
            text-indent: 30px;
            color: plum;
        }

        .special-offer {
            font-size: 22px;
            font-weight: bold;
            color: beige;
            background-color: green;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 2px 2px #1da88a;
            box-shadow: 0 0 12px #b22222;
            transform: rotate(-2deg);
        }
    </style>
</head>

<body>

    <div class="menu-card">
        <h1 class="restraunt-name">Tasty Treat Cafe</h1>
        <p class="tagline">Fresh Food,happy mood!</p>
        <div class="dish-name">cheesy garlic bread</div>
        <p class="dish-description">
            Crispy bread topped with melted cheese,Garlic butter, and fresh herbs.
        </p>
        <p class="dish-name">spicy corn bites</p>
        <p class="dish-description">
            Soft pasta cooked in creamy sauce with vegetables and delicious seasoning.
        </p>
        <p name="special-offer">Weekend special: 20% off!</p>
    </div>

</body>

</html>
